<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1565c0">
<meta name="description" content="Control de clientes y préstamos">
<title>Clientes Préstamos</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#17202a;
}
header{
  background:#1565c0;
  color:white;
  padding:20px 16px;
  position:sticky;
  top:0;
  z-index:10;
}
header h1{margin:0;font-size:25px}
header p{margin:5px 0 0;opacity:.9}
main{padding:15px;max-width:700px;margin:auto}
.card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 2px 8px #0001;
}
button{
  border:0;
  border-radius:10px;
  padding:12px 15px;
  font-size:16px;
  cursor:pointer;
}
.primary{background:#1565c0;color:white}
.danger{background:#d32f2f;color:white}
.secondary{background:#e9eef5;color:#17202a}
.whatsapp{background:#25D366;color:white}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.stat{
  padding:15px;
  border-radius:14px;
  background:#eef5ff;
}
.stat strong{display:block;font-size:24px}
.client{
  display:flex;
  gap:12px;
  align-items:center;
}
.client-photos{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  width:125px;
  flex-shrink:0;
}
.avatar{
  width:58px;
  height:58px;
  border-radius:12px;
  object-fit:cover;
  background:#dbe8f8;
  cursor:pointer;
}
.client-info{flex:1}
.client-info strong{display:block;font-size:18px}
.small{font-size:13px;color:#68737d}
.route-badge{
  display:inline-block;
  background:#e3f2fd;
  color:#1565c0;
  border-radius:999px;
  padding:5px 9px;
  font-size:12px;
  font-weight:bold;
  margin-top:5px;
}
.route-filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:2px 0 12px;
}
.route-filters button{
  white-space:nowrap;
  padding:9px 12px;
  font-size:14px;
  background:#e9eef5;
}
.route-filters button.active{
  background:#1565c0;
  color:white;
}
.photo-preview{
  width:100%;
  max-height:250px;
  object-fit:cover;
  border-radius:12px;
  margin:8px 0;
}
.preview-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:8px 0;
}
.preview-item{
  position:relative;
}
.preview-item img{
  width:100%;
  height:100px;
  object-fit:cover;
  border-radius:10px;
  display:block;
  cursor:pointer;
}
.remove-photo{
  position:absolute;
  top:4px;
  right:4px;
  width:30px;
  height:30px;
  padding:0;
  border-radius:50%;
  background:#d32f2f;
  color:white;
  font-size:18px;
}
.hidden{display:none}
.search{margin-bottom:10px}
.empty{
  text-align:center;
  padding:30px 10px;
  color:#69757d;
}
.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
  flex-wrap:wrap;
}
.actions button,.actions a{flex:1;min-width:140px}
.detail-gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:18px;
}
.detail-gallery img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:12px;
  cursor:pointer;
}
.no-photo{
  background:#eef2f5;
  border-radius:12px;
  padding:30px 10px;
  text-align:center;
  color:#69757d;
  margin-bottom:18px;
}
.gallery-modal{
  position:fixed;
  inset:0;
  background:#000e;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.gallery-modal.hidden{display:none}
.gallery-content{
  width:100%;
  max-width:700px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
}
.gallery-image{
  max-width:100%;
  max-height:75vh;
  object-fit:contain;
  border-radius:10px;
}
.gallery-top{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:white;
}
.gallery-counter{
  font-size:16px;
  font-weight:bold;
}
.gallery-close{
  background:white;
  color:#17202a;
  width:44px;
  height:44px;
  padding:0;
  border-radius:50%;
  font-size:25px;
}
.gallery-controls{
  display:flex;
  gap:15px;
}
.gallery-controls button{
  background:white;
  color:#17202a;
  min-width:120px;
}
label{
  display:block;
  margin-top:12px;
  margin-bottom:5px;
  font-weight:bold;
}
input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccd3da;
  border-radius:10px;
  font-size:16px;
  background:white;
}
textarea{resize:vertical}
footer{
  text-align:center;
  color:#7b858d;
  font-size:12px;
  padding:20px;
}
@media(max-width:430px){
  .client-photos{width:80px}
  .client-photos .avatar{width:38px;height:38px}
  .detail-gallery img{height:150px}
  .preview-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<header>
  <h1>📋 Clientes Préstamos</h1>
  <p>Control de clientes y préstamos</p>
</header>

<main>

<section id="home">

  <div class="stats">
    <div class="stat">
      <span>Clientes</span>
      <strong id="totalClientes">0</strong>

    placeholder="🔎 Buscar por nombre, teléfono, documento o dirección..."
    oninput="mostrarClientes()"
  >

  <div id="filtrosRuta" class="route-filters"></div>

  <div id="listaClientes"></div>

    <label>Documento / CPF</label>

    <label>Dirección</label>
    <input id="direccion" type="text" placeholder="Dirección completa">

    <label>Ruta</label>
    <select id="ruta">
      <option value="Ruta 1">Ruta 1</option>
      <option value="Ruta 2">Ruta 2</option>
      <option value="Ruta 3">Ruta 3</option>
      <option value="Ruta 4">Ruta 4</option>
      <option value="Ruta 5">Ruta 5</option>
      <option value="Sin ruta">Sin ruta</option>
    </select>

    <label>Valor del préstamo</label>
    <input id="prestamo" type="number" step="0.01" placeholder="0.00">

    <label>Fecha</label>
    <input id="fecha" type="date">

    <label>Observaciones</label>
    <textarea id="observaciones" rows="3" placeholder="Notas del cliente"></textarea>
