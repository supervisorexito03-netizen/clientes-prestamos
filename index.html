<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1565c0">
<meta name="description" content="Control de clientes y préstamos">
<title>Clientes Préstamos</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#17202a;
}
header{
  background:#1565c0;
  color:white;
  padding:20px 16px;
  position:sticky;
  top:0;
  z-index:10;
}
header h1{margin:0;font-size:25px}
header p{margin:5px 0 0;opacity:.9}
main{padding:15px;max-width:700px;margin:auto}
.card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 2px 8px #0001;
}
button, .btn-link{
  border:0;
  border-radius:10px;
  padding:12px 15px;
  font-size:16px;
  cursor:pointer;
  display:inline-block;
  text-align:center;
  text-decoration:none;
}
.primary{background:#1565c0;color:white}
.danger{background:#d32f2f;color:white}
.secondary{background:#e9eef5;color:#17202a}
.whatsapp{background:#25d366;color:white;font-weight:bold}
input,textarea,select{
  width:100%;
  padding:13px;
  border:1px solid #ccd3da;
  border-radius:10px;
  margin:6px 0 12px;
  font-size:16px;
}
label{font-weight:bold;font-size:14px}
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.stat{
  padding:15px;
  border-radius:14px;
  background:#eef5ff;
}
.stat strong{display:block;font-size:24px}
.client{
  display:flex;
  gap:12px;
  align-items:center;
}
.avatar{
  width:58px;
  height:58px;
  border-radius:50%;
  object-fit:cover;
  background:#dbe8f8;
}
.client-info{flex:1}
.client-info strong{display:block;font-size:18px}
.small{font-size:13px;color:#68737d}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.photo-container{
  position:relative;
  width:100%;
  background:#000;
  border-radius:12px;
  overflow:hidden;
  margin:8px 0;
}
.photo-preview{
  width:100%;
  max-height:350px;
  object-fit:contain;
  display:block;
}
.gallery-nav{
  display:flex;
  justify-content:space-between;
  background:rgba(0,0,0,0.6);
  padding:8px;
  color:white;
  align-items:center;
}
.gallery-nav button{
  padding:5px 12px;
  font-size:14px;
  background:white;
  color:black;
}
.hidden{display:none}
.search, .filter-select{
  margin-bottom:15px;
}
.empty{
  text-align:center;
  padding:30px 10px;
  color:#69757d;
}
footer{
  text-align:center;
  color:#7b858d;
  font-size:12px;
  padding:20px;
}
</style>
</head>

<body>

<header>
  <h1>📋 Clientes Préstamos</h1>
  <p>Control de clientes y préstamos</p>
</header>

<main>

<section id="home">

  <div class="stats">
    <div class="stat">
      <span>Clientes</span>
      <strong id="totalClientes">0</strong>
    </div>
    <div class="stat">
      <span>Préstamos</span>
      <strong id="totalPrestamos">0</strong>
    </div>
  </div>

  <div class="card">
    <button class="primary" style="width:100%" onclick="mostrarFormulario()">
      ➕ Nuevo cliente
    </button>
  </div>

  <label>Filtrar por Ruta</label>
  <select id="filtroRuta" class="filter-select" onchange="mostrarClientes()">
    <option value="Todas">Todas las rutas</option>
    <option value="Ruta Centro">Ruta Centro</option>
    <option value="Ruta Norte">Ruta Norte</option>
    <option value="Ruta Sur">Ruta Sur</option>
    <option value="Ruta Este">Ruta Este</option>
    <option value="Ruta Oeste">Ruta Oeste</option>
  </select>

  <input
    class="search"
    id="buscar"
    placeholder="🔎 Buscar cliente por nombre, tel o doc..."
    oninput="mostrarClientes()"
  >

  <div id="listaClientes"></div>

</section>

<section id="formulario" class="hidden">

  <div class="card">
    <h2 id="tituloFormulario">Nuevo cliente</h2>

    <label>Nombre completo</label>
    <input id="nombre" type="text" placeholder="Nombre del cliente">

    <label>Ruta asignada</label>
    <select id="ruta">
      <option value="Ruta Centro">Ruta Centro</option>
      <option value="Ruta Norte">Ruta Norte</option>
      <option value="Ruta Sur">Ruta Sur</option>
      <option value="Ruta Este">Ruta Este</option>
      <option value="Ruta Oeste">Ruta Oeste</option>
    </select>

    <label>Teléfono</label>
    <input id="telefono" type="tel" placeholder="Teléfono">

    <label>Documento / CPF</label>
    <input id="documento" type="text" placeholder="Documento">

    <label>Dirección</label>
    <input id="direccion" type="text" placeholder="Dirección">

    <label>Valor del préstamo</label>
    <input id="prestamo" type="number" step="0.01" placeholder="0.00">

    <label>Cuota</label>
    <input id="cuota" type="number" step="0.01" placeholder="0.00">

    <label>Fecha</label>
    <input id="fecha" type="date">

    <label>Observaciones</label>
    <textarea id="observaciones" rows="3" placeholder="Notas del cliente"></textarea>

    <label>Subir fotos (Puedes seleccionar varias)</label>
    <input id="foto" type="file" accept="image/*" multiple onchange="previsualizarFotos()">

    <div id="wrapperPreview" class="photo-container hidden">
      <img id="preview" class="photo-preview">
      <div id="navPreview" class="gallery-nav hidden">
        <button type="button" onclick="cambiarFotoPreview(-1)">◀ Ant.</button>
        <span id="infoPreview">1 de 1</span>
        <button type="button" onclick="cambiarFotoPreview(1)">Sig. ▶</button>
      </div>
    </div>

    <div class="actions">
      <button class="primary" onclick="guardarCliente()">💾 Guardar</button>
      <button class="secondary" onclick="cancelarFormulario()">Cancelar</button>
    </div>
  </div>

</section>

<section id="detalle" class="hidden">
  <div class="card">
    <div id="detalleContenido"></div>

    <div class="actions">
      <button class="primary" onclick="editarCliente()">✏️ Editar</button>
      <button class="danger" onclick="eliminarCliente()">🗑️ Eliminar</button>
      <button class="secondary" onclick="volverInicio()">← Volver</button>
    </div>
  </div>
</section>

<footer>
  Clientes Préstamos
</footer>

</main>

<script>
let clientes = JSON.parse(localStorage.getItem("clientesPrestamos") || "[]");
let clienteActual = null;
let fotosTemporales = [];
let indicePreviewActual = 0;
let indiceDetalleActual = 0;

function guardarDatos(){
  localStorage.setItem("clientesPrestamos", JSON.stringify(clientes));
}

function mostrarFormulario(id=null){
  document.getElementById("home").classList.add("hidden");
  document.getElementById("detalle").classList.add("hidden");
  document.getElementById("formulario").classList.remove("hidden");

  clienteActual = id;
  fotosTemporales = [];
  indicePreviewActual = 0;

  if(id !== null){
    const c = clientes.find(x => x.id === id);

    document.getElementById("tituloFormulario").textContent = "Editar cliente";
    document.getElementById("nombre").value = c.nombre;
    document.getElementById("ruta").value = c.ruta || "Ruta Centro";
    document.getElementById("telefono").value = c.telefono;
    document.getElementById("documento").value = c.documento;
    document.getElementById("direccion").value = c.direccion;
    document.getElementById("prestamo").value = c.prestamo;
    document.getElementById("cuota").value = c.cuota;
    document.getElementById("fecha").value = c.fecha;
    document.getElementById("observaciones").value = c.observaciones;
    
    if (c.fotos && c.fotos.length > 0) {
      fotosTemporales = [...c.fotos];
    } else if (c.foto) {
      fotosTemporales = [c.foto];
    }

    actualizarVisorPreview();
  } else {
    limpiarFormulario();
    document.getElementById("tituloFormulario").textContent = "Nuevo cliente";
  }
}

function limpiarFormulario() {
  document.getElementById("nombre").value = "";
  document.getElementById("ruta").selectedIndex = 0;
  document.getElementById("telefono").value = "";
  document.getElementById("documento").value = "";
  document.getElementById("direccion").value = "";
  document.getElementById("prestamo").value = "";
  document.getElementById("cuota").value = "";
  document.getElementById("fecha").value = "";
  document.getElementById("observaciones").value = "";
  document.getElementById("foto").value = "";
  fotosTemporales = [];
  indicePreviewActual = 0;
  actualizarVisorPreview();
}

function previsualizarFotos() {
  const archivos = document.getElementById("foto").files;
  if (!archivos || archivos.length === 0) return;

  const lectores = [];
  for (let i = 0; i < archivos.length; i++) {
    lectores.push(new Promise((resolve, reject) => {
      const lector = new FileReader();
      lector.onload = e => resolve(e.target.result);
      lector.onerror = reject;
      lector.readAsDataURL(archivos[i]);
    }));
  }

  Promise.all(lectores).then(fotosBase64 => {
    fotosTemporales = fotosBase64;
    indicePreviewActual = 0;
    actualizarVisorPreview();
  });
}

function actualizarVisorPreview() {
  const wrapper = document.getElementById("wrapperPreview");
  const img = document.getElementById("preview");
  const nav = document.getElementById("navPreview");
  const info = document.getElementById("infoPreview");

  if (fotosTemporales.length > 0) {
    wrapper.classList.remove("hidden");
    img.src = fotosTemporales[indicePreviewActual];
    
    if (fotosTemporales.length > 1) {
      nav.classList.remove("hidden");
      info.textContent = `${indicePreviewActual + 1} de ${fotosTemporales.length}`;
    } else {
      nav.classList.add("hidden");
    }
  } else {
    wrapper.classList.add("hidden");
    img.src = "";
    nav.classList.add("hidden");
  }
}

function cambiarFotoPreview(direccion) {
  indicePreviewActual += direccion;
  if (indicePreviewActual < 0) indicePreviewActual = fotosTemporales.length - 1;
  if (indicePreviewActual >= fotosTemporales.length) indicePreviewActual = 0;
  actualizarVisorPreview();
}
