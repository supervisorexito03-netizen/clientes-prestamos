<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1565c0">
<meta name="description" content="Control de clientes y préstamos">
<title>Clientes Préstamos</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#17202a;
}
header{
  background:#1565c0;
  color:white;
  padding:20px 16px;
  position:sticky;
  top:0;
  z-index:10;
}
header h1{margin:0;font-size:25px}
header p{margin:5px 0 0;opacity:.9}
main{padding:15px;max-width:700px;margin:auto}
.card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 2px 8px #0001;
}
button{
  border:0;
  border-radius:10px;
  padding:12px 15px;
  font-size:16px;
  cursor:pointer;
}
.primary{background:#1565c0;color:white}
.danger{background:#d32f2f;color:white}
.secondary{background:#e9eef5;color:#17202a}
input,textarea,select{
  width:100%;
  padding:13px;
  border:1px solid #ccd3da;
  border-radius:10px;
  margin:6px 0 12px;
  font-size:16px;
}
label{font-weight:bold;font-size:14px}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.stat{
  padding:15px;
  border-radius:14px;
  background:#eef5ff;
}
.stat strong{display:block;font-size:24px}
.client{
  display:flex;
  gap:12px;
  align-items:center;
}
.avatar{
  width:58px;
  height:58px;
  border-radius:50%;
  object-fit:cover;
  background:#dbe8f8;
}
.client-info{flex:1}
.client-info strong{display:block;font-size:18px}
.small{font-size:13px;color:#68737d}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.photo-preview{
  width:100%;
  max-height:250px;
  object-fit:cover;
  border-radius:12px;
  margin:8px 0;
}
.hidden{display:none}
.search{
  margin-bottom:15px;
}
.empty{
  text-align:center;
  padding:30px 10px;
  color:#69757d;
}
footer{
  text-align:center;
  color:#7b858d;
  font-size:12px;
  padding:20px;
}
</style>
</head>

<body>

<header>
  <h1>📋 Clientes Préstamos</h1>
  <p>Control de clientes y préstamos</p>
</header>

<main>

<section id="home">

  <div class="stats">
    <div class="stat">
      <span>Clientes</span>
      <strong id="totalClientes">0</strong>
    </div>
    <div class="stat">
      <span>Préstamos</span>
      <strong id="totalPrestamos">0</strong>
    </div>
  </div>

  <div class="card">
    <button class="primary" style="width:100%" onclick="mostrarFormulario()">
      ➕ Nuevo cliente
    </button>
  </div>

  <input
    class="search"
    id="buscar"
    placeholder="🔎 Buscar cliente..."
    oninput="mostrarClientes()"
  >

  <div id="listaClientes"></div>

</section>

<section id="formulario" class="hidden">

  <div class="card">
    <h2 id="tituloFormulario">Nuevo cliente</h2>

    <label>Nombre completo</label>
    <input id="nombre" type="text" placeholder="Nombre del cliente">

    <label>Teléfono</label>
    <input id="telefono" type="tel" placeholder="Teléfono">

    <label>Documento / CPF</label>
    <input id="documento" type="text" placeholder="Documento">

    <label>Dirección</label>
    <input id="direccion" type="text" placeholder="Dirección">

    <label>Valor del préstamo</label>
    <input id="prestamo" type="number" step="0.01" placeholder="0.00">

    <label>Cuota</label>
    <input id="cuota" type="number" step="0.01" placeholder="0.00">

    <label>Fecha</label>
    <input id="fecha" type="date">

    <label>Observaciones</label>
    <textarea id="observaciones" rows="3" placeholder="Notas del cliente"></textarea>

    <label>Foto del cliente</label>
    <input id="foto" type="file" accept="image/*" multiple onchange="previsualizarFoto()">

    <img id="preview" class="photo-preview hidden">

    <div class="actions">
      <button class="primary" onclick="guardarCliente()">💾 Guardar</button>
      <button class="secondary" onclick="cancelarFormulario()">Cancelar</button>
    </div>
  </div>

</section>

<section id="detalle" class="hidden">
  <div class="card">
    <div id="detalleContenido"></div>

    <div class="actions">
      <button class="primary" onclick="editarCliente()">✏️ Editar</button>
      <button class="danger" onclick="eliminarCliente()">🗑️ Eliminar</button>
      <button class="secondary" onclick="volverInicio()">← Volver</button>
    </div>
  </div>
</section>

<footer>
  Clientes Préstamos
</footer>

</main>

<script>
let clientes = JSON.parse(localStorage.getItem("clientesPrestamos") || "[]");
let clienteActual = null;
let fotoActual = "";

function guardarDatos(){
  localStorage.setItem("clientesPrestamos", JSON.stringify(clientes));
}

function mostrarFormulario(id=null){
  document.getElementById("home").classList.add("hidden");
  document.getElementById("detalle").classList.add("hidden");
  document.getElementById("formulario").classList.remove("hidden");

  clienteActual = id;

  if(id !== null){
    const c = clientes.find(x => x.id === id);

    document.getElementById("tituloFormulario").textContent = "Editar cliente";
    document.getElementById("nombre").value = c.nombre;
    document.getElementById("telefono").value = c.telefono;
    document.getElementById("documento").value = c.documento;
    document.getElementById("direccion").value = c.direccion;
    document.getElementById("prestamo").value = c.prestamo;
    document.getElementById("cuota").value = c.cuota;
    document.getElementById("fecha").value = c.fecha;
    document.getElementById("observaciones").value = c.observaciones;
    fotoActual = c.foto || "";

    if (fotoActual) {
      document.getElementById("preview").src = fotoActual;
      document.getElementById("preview").classList.remove("hidden");
    }
  } else {
    limpiarFormulario();
    document.getElementById("tituloFormulario").textContent = "Nuevo cliente";
  }
}

function limpiarFormulario() {
  document.getElementById("nombre").value = "";
  document.getElementById("telefono").value = "";
  document.getElementById("documento").value = "";
  document.getElementById("direccion").value = "";
  document.getElementById("prestamo").value = "";
  document.getElementById("cuota").value = "";
  document.getElementById("fecha").value = "";
  document.getElementById("observaciones").value = "";
  document.getElementById("foto").value = "";
  document.getElementById("preview").src = "";
  document.getElementById("preview").classList.add("hidden");
  fotoActual = "";
}

function previsualizarFoto() {
  const archivos = document.getElementById("foto").files;

  if (!archivos || archivos.length === 0) return;

  const lectores = [];

  for (let i = 0; i < archivos.length; i++) {
    lectores.push(new Promise((resolve, reject) => {
      const lector = new FileReader();

      lector.onload = function(e) {
        resolve(e.target.result);
      };

      lector.onerror = reject;
      lector.readAsDataURL(archivos[i]);
    }));
  }

  Promise.all(lectores).then(function(fotos) {
    fotoActual = fotos;
    
    const preview = document.getElementById("preview");
    preview.src = fotos[0];
    preview.classList.remove("hidden");
  });
}

function guardarCliente() {
  const nombre = document.getElementById("nombre").value.trim();

  if (!nombre) {
    alert("Escribe el nombre del cliente.");
    return;
  }

  const cliente = {
    id: clienteActual !== null ? clienteActual : Date.now(),
    nombre: nombre,
    telefono: document.getElementById("telefono").value.trim(),
    documento: document.getElementById("documento").value.trim(),
    direccion: document.getElementById("direccion").value.trim(),
    prestamo: document.getElementById("prestamo").value,
    cuota: document.getElementById("cuota").value,
    fecha: document.getElementById("fecha").value,
    observaciones: document.getElementById("observaciones").value.trim(),
    fotos: Array.isArray(fotoActual) ? fotoActual : (fotoActual ? [fotoActual] : []),
foto: Array.isArray(fotoActual) ? fotoActual[0] : (fotoActual || "")
  };

  if (clienteActual !== null) {
    const indice = clientes.findIndex(x => x.id === clienteActual);

    if (indice !== -1) {
      clientes[indice] = cliente;
    }
  } else {
    clientes.push(cliente);
  }

  guardarDatos();
  clienteActual = null;
  fotoActual = "";

  mostrarClientes();
  volverInicio();

  alert("Cliente guardado correctamente.");
}

function mostrarClientes() {
  const lista = document.getElementById("listaClientes");
  const buscar = document.getElementById("buscar").value.toLowerCase().trim();

  const filtrados = clientes.filter(c =>
    (c.nombre || "").toLowerCase().includes(buscar) ||
    (c.telefono || "").toLowerCase().includes(buscar) ||
    (c.documento || "").toLowerCase().includes(buscar)
  );

  document.getElementById("totalClientes").textContent = clientes.length;

  document.getElementById("totalPrestamos").textContent =
    clientes.filter(c => Number(c.prestamo) > 0).length;

  if (filtrados.length === 0) {
    lista.innerHTML = `
      <div class="empty">
        No hay clientes registrados.
      </div>
    `;
    return;
  }

  lista.innerHTML = filtrados.map(c => `
    <div class="card">
      <div class="client">
        ${
    (Array.isArray(c.fotos) ? c.fotos : (c.foto ? [c.foto] : []))
        .map(foto => `<img class="avatar" src="${foto}">`)
        .join("")
        }

        <div class="client-info">
          <strong>${escapar(c.nombre)}</strong>
          <div class="small">
            ${escapar(c.telefono || "Sin teléfono")}
          </div>
          <div class="small">
            ${escapar(c.direccion || "Sin dirección")}
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="primary" onclick="verCliente(${c.id})">
          👁️ Ver
        </button>

        <button class="secondary" onclick="mostrarFormulario(${c.id})">
          ✏️ Editar
        </button>
      </div>
    </div>
  `).join("");
}

function verCliente(id) {
  const c = clientes.find(x => x.id === id);

  if (!c) return;

  clienteActual = id;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("formulario").classList.add("hidden");
  document.getElementById("detalle").classList.remove("hidden");

  const mapa = c.direccion
    ? `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(c.direccion)}`
    : "";

  document.getElementById("detalleContenido").innerHTML = `
    ${
      c.foto
      ? `<img src="${c.foto}" class="photo-preview">`
      : ""
    }

    <h2>${escapar(c.nombre)}</h2>

    <p><strong>📞 Teléfono:</strong><br>
    ${escapar(c.telefono || "No registrado")}</p>

    <p><strong>🪪 Documento / CPF:</strong><br>
    ${escapar(c.documento || "No registrado")}</p>

    <p><strong>🏠 Dirección:</strong><br>
    ${escapar(c.direccion || "No registrada")}</p>

    <p><strong>💰 Préstamo:</strong><br>
    ${escapar(c.prestamo || "0")}</p>

    <p><strong>💵 Cuota:</strong><br>
    ${escapar(c.cuota || "0")}</p>

    <p><strong>📅 Fecha:</strong><br>
    ${escapar(c.fecha || "No registrada")}</p>

    <p><strong>📝 Observaciones:</strong><br>
    ${escapar(c.observaciones || "Sin observaciones")}</p>

    ${
      mapa
      ? `
        <div class="actions">
          <a
            href="${mapa}"
            target="_blank"
            rel="noopener"
            style="
              display:block;
              width:100%;
              text-align:center;
              text-decoration:none;
              background:#1565c0;
              color:white;
              padding:12px 15px;
              border-radius:10px;
              font-size:16px;
            ">
            🗺️ Cómo llegar con Google Maps
          </a>
        </div>
      `
      : ""
    }
  `;
}

function editarCliente() {
  if (clienteActual !== null) {
    mostrarFormulario(clienteActual);
  }
}

function eliminarCliente() {
  if (clienteActual === null) return;

  const c = clientes.find(x => x.id === clienteActual);

  if (!c) return;

  if (!confirm(`¿Eliminar a ${c.nombre}?`)) {
    return;
  }

  clientes = clientes.filter(x => x.id !== clienteActual);

  guardarDatos();

  clienteActual = null;

  mostrarClientes();
  volverInicio();
}

function cancelarFormulario() {
  clienteActual = null;
  fotoActual = "";
  limpiarFormulario();
  volverInicio();
}

function volverInicio() {
  document.getElementById("formulario").classList.add("hidden");
  document.getElementById("detalle").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");

  mostrarClientes();
}

function escapar(texto) {
  return String(texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

mostrarClientes();

</script>

</body>
</html>
